name: PureRef preview tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pureref
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pureref-preview-results
          path: test-results/
